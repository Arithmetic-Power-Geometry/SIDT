[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidt"
version = "1.0.0"
description = "Structural Inversion Dimension Theory reproducibility package"
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","pandas>=2.0","networkx>=3.0","scipy>=1.10","scikit-learn>=1.3","matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
